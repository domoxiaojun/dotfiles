#? btop 配置
# 注意:文件名用 chezmoi 的 create_ 前缀,只在目标不存在时创建。
# 因为 btop 退出时会把完整配置回写到本文件,持续管理会让 chezmoi diff 永远有差异。
# 想重置成仓库版本:删掉 ~/.config/btop/btop.conf 后重新 chezmoi apply。

# Catppuccin Mocha 主题(主题文件由本仓库部署到 ~/.config/btop/themes/)
color_theme = "catppuccin_mocha"

# 背景跟随终端(配合 Ghostty 的半透明背景)
theme_background = False
