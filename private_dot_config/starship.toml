# Starship Prompt 配置
# 参考: https://starship.rs/config/
command_timeout = 2000

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$lua\
$nodejs\
$line_break\
$character"""

[directory]
style = "bold blue"
# 增加一个文件夹图标，Ghostty 渲染得非常漂亮
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
fish_style_pwd_dir_length = 4
read_only = " 󰌾"
#truncate_to_repo = true # 在 Git 仓库中缩短路径

[git_status]
# 保持简洁，但使用易读的符号
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "cyan"
conflicted = "󰞇 "
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "? "
stashed = "≡ "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[hostname]
ssh_only = true # 仅在 SSH 时显示
format = "[$hostname]($style) "

[username]
show_always = false # 仅在非默认用户或 SSH 时显示

