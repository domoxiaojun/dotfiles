name: Validate dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Job 1: 模板渲染 + 渲染后的 shell 脚本语法检查（跨三平台）
  # ============================================================
  validate-templates:
    name: Render & syntax-check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi (Unix)
        if: runner.os != 'Windows'
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm get.scoop.sh -outfile install.ps1
          .\install.ps1 -RunAsAdmin
          scoop install chezmoi
          # 把 scoop shims 加到 GITHUB_PATH，后续 bash step 才能找到 chezmoi
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\scoop\shims"

      - name: Add chezmoi to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Render .chezmoi.yaml.tmpl (init mode)
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/rendered "$HOME/.config/chezmoi"
          # init 模式只用于渲染 .chezmoi.yaml.tmpl（其它模板不能用 --init，
          # 因为 init 模式下 .chezmoitemplates 不可用）
          if [ -f .chezmoi.yaml.tmpl ]; then
            echo "渲染 (init): .chezmoi.yaml.tmpl"
            chezmoi execute-template --source . --init \
              --promptString "name=CI" --promptString "email=ci@example.com" \
              < .chezmoi.yaml.tmpl > /tmp/rendered/chezmoi.yaml
            # 把渲染好的 yaml 放到 chezmoi 默认配置位置，让后续 normal-mode 渲染
            # 能拿到 .git.user.name 等模板数据
            cp /tmp/rendered/chezmoi.yaml "$HOME/.config/chezmoi/chezmoi.yaml"
          fi

      - name: Render all other .tmpl files (normal mode)
        shell: bash
        run: |
          set -e
          for f in $(find . -name "*.tmpl" -not -path "./.git/*" -not -name ".chezmoi.yaml.tmpl"); do
            echo "渲染: $f"
            chezmoi execute-template --source . -f "$f" > "/tmp/rendered/$(basename "${f%.tmpl}")"
          done

      - name: Syntax check rendered shell scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # bash 语法检查
          for f in /tmp/rendered/*.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "[OK] bash -n $f"
          done
          # zsh 语法检查（仅 macOS/Ubuntu 默认有 zsh，Linux 上需先装）
          if command -v zsh >/dev/null 2>&1; then
            for f in /tmp/rendered/dot_zshrc /tmp/rendered/dot_zprofile; do
              [ -f "$f" ] && zsh -n "$f" && echo "[OK] zsh -n $f"
            done
          fi

      - name: Syntax check PowerShell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PowerShell 语法检查
          Get-ChildItem /tmp/rendered/*.ps1 -ErrorAction SilentlyContinue | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Parse error in $($_.Name): $($errors -join ', ')"
              exit 1
            }
            Write-Host "[OK] $($_.Name)"
          }

      - name: Syntax check repo PowerShell sources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 仓库内非模板 .ps1（PowerShell profile、辅助脚本）不经渲染步骤，单独解析检查
          $files = Get-ChildItem -Path Documents, scripts -Recurse -Filter *.ps1 -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Parse error in $($f.FullName): $($errors -join ', ')"
              exit 1
            }
            Write-Host "[OK] $($f.FullName)"
          }

  # ============================================================
  # Job 2: shellcheck 静态检查
  # ============================================================
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Render shell scripts and shellcheck
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/rendered "$HOME/.config/chezmoi"
          # 先生成 chezmoi.yaml 让模板能拿到 .git.user.name 等数据
          chezmoi execute-template --source . --init \
            --promptString "name=CI" --promptString "email=ci@example.com" \
            < .chezmoi.yaml.tmpl > "$HOME/.config/chezmoi/chezmoi.yaml"
          for f in $(find . -name "*.sh.tmpl" -not -path "./.git/*"); do
            echo "渲染: $f"
            chezmoi execute-template --source . -f "$f" \
              > "/tmp/rendered/$(basename "${f%.tmpl}")"
          done
          # shellcheck 阻断模式：发现 warning 及以上问题即失败
          # 排除项说明——SC1090/1091: source 动态路径；SC2155: local 同时赋值；SC2034: 未使用变量（chezmoi 注入的可能用）
          status=0
          for f in /tmp/rendered/*.sh; do
            # 跳过空文件（darwin 脚本在 linux 上渲染为空，属预期）
            [ -s "$f" ] || continue
            echo "shellcheck: $f"
            shellcheck -e SC1090,SC1091,SC2155,SC2034 -S warning "$f" || status=1
          done
          exit $status

  # ============================================================
  # Job 3: yamllint 检查 yaml 格式
  # ============================================================
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint yaml files
        run: |
          # 使用宽松规则（dotfiles 不强制行长度等严格风格）
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable}}" \
            .chezmoidata/ .github/workflows/
