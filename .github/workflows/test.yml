name: Validate dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Job 1: 模板渲染 + 渲染后的 shell 脚本语法检查（跨三平台）
  # ============================================================
  validate-templates:
    name: Render & syntax-check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi (Unix)
        if: runner.os != 'Windows'
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm get.scoop.sh -outfile install.ps1
          .\install.ps1 -RunAsAdmin
          scoop install chezmoi

      - name: Add chezmoi to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Render all .tmpl files
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/rendered
          for f in $(find . -name "*.tmpl" -not -path "./.git/*"); do
            echo "渲染: $f"
            chezmoi execute-template --source . --init \
              --promptString "name=CI" --promptString "email=ci@example.com" \
              < "$f" > "/tmp/rendered/$(basename "$f")" 2>&1
          done

      - name: Syntax check rendered shell scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # bash 语法检查
          for f in /tmp/rendered/*.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "[OK] bash -n $f"
          done
          # zsh 语法检查（仅 macOS/Ubuntu 默认有 zsh，Linux 上需先装）
          if command -v zsh >/dev/null 2>&1; then
            for f in /tmp/rendered/zshrc /tmp/rendered/zprofile; do
              [ -f "$f" ] && zsh -n "$f" && echo "[OK] zsh -n $f"
            done
          fi

      - name: Syntax check PowerShell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PowerShell 语法检查
          Get-ChildItem /tmp/rendered/*.ps1 -ErrorAction SilentlyContinue | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Parse error in $($_.Name): $($errors -join ', ')"
              exit 1
            }
            Write-Host "[OK] $($_.Name)"
          }

  # ============================================================
  # Job 2: shellcheck 静态检查
  # ============================================================
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Render shell scripts and shellcheck
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/rendered
          for f in $(find . -name "*.sh.tmpl" -not -path "./.git/*"); do
            echo "渲染: $f"
            chezmoi execute-template --source . --init \
              --promptString "name=CI" --promptString "email=ci@example.com" \
              < "$f" > "/tmp/rendered/$(basename "${f%.tmpl}")"
          done
          # shellcheck（容错：dotfiles 脚本常用 sudo / source 等动态特性，部分警告可忽略）
          # SC1090/1091: source 动态路径；SC2155: declare 同时赋值；SC2034: 未使用变量（chezmoi 注入的可能用）
          for f in /tmp/rendered/*.sh; do
            [ -f "$f" ] && shellcheck -e SC1090,SC1091,SC2155,SC2034 -S warning "$f" || true
          done

  # ============================================================
  # Job 3: yamllint 检查 yaml 格式
  # ============================================================
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint yaml files
        run: |
          # 使用宽松规则（dotfiles 不强制行长度等严格风格）
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable}}" \
            .chezmoidata/ .github/workflows/

  # ============================================================
  # Job 4: 配置文件加载验证（yazi/starship/tmux 等能正确解析配置）
  # ============================================================
  config-load-check:
    name: Config load verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Render configs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ~/.config/yazi ~/.config
          # 渲染并落到目标位置
          chezmoi execute-template --source . -f private_dot_config/yazi/yazi.toml \
            > ~/.config/yazi/yazi.toml
          chezmoi execute-template --source . -f private_dot_config/starship.toml.tmpl \
            > ~/.config/starship.toml

      - name: Install yazi & verify config
        run: |
          # 用 cargo 装最新 yazi（Ubuntu 上没有官方包）
          if ! command -v yazi >/dev/null 2>&1; then
            sudo apt-get install -y cargo
            cargo install --locked yazi-fm 2>&1 | tail -5 || echo "yazi 安装失败，跳过"
          fi
          # 仅验证配置能被解析（不用真启动 GUI）
          if command -v yazi >/dev/null 2>&1; then
            yazi --version
            # yazi 加载 yazi.toml，配置错会输出到 stderr
            timeout 3 yazi || code=$?
            # 退出码 124 = timeout（正常退出），其他非零是配置错
            [ "${code:-0}" = "124" ] || [ "${code:-0}" = "0" ] || exit 1
          fi

      - name: Install starship & verify config
        run: |
          curl -sS https://starship.rs/install.sh | sh -s -- -y
          # starship 检查配置
          STARSHIP_CONFIG=~/.config/starship.toml starship config 2>&1 || true
          # starship print-config 应该不报错
          STARSHIP_CONFIG=~/.config/starship.toml starship print-config -d > /dev/null
